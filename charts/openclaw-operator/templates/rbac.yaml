{{- if .Values.rbac.create -}}
{{- $managerName := printf "%s-manager-role" (include "openclaw-operator.fullname" .) -}}
{{- $managerBinding := printf "%s-manager-rolebinding" (include "openclaw-operator.fullname" .) -}}
{{- $saName := include "openclaw-operator.serviceAccountName" . -}}
{{- $saNamespace := .Release.Namespace -}}
{{- $labels := include "openclaw-operator.labels" . -}}
{{- if gt (len .Values.watchNamespaces) 0 -}}
{{- range $i, $ns := .Values.watchNamespaces }}
{{- if gt $i 0 }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $managerName }}
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  {{- include "openclaw-operator.managerRules" $ | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $managerBinding }}
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $managerName }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $saNamespace }}
{{- end }}
{{- if not (has $saNamespace .Values.watchNamespaces) }}
---
# In namespaced mode the operator still reads its own backup credentials Secret
# (s3-backup-credentials) from the release namespace, so the Secret informer is
# scoped to the watched namespaces plus this one. Without a matching Role the
# informer fails with Forbidden and the manager never starts (#586). Only
# Secrets are granted here -- the operator manages no child resources in its own
# namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $managerName }}-operator-ns
  namespace: {{ $saNamespace }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $managerBinding }}-operator-ns
  namespace: {{ $saNamespace }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $managerName }}-operator-ns
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $saNamespace }}
{{- end }}
---
# OpenClawClusterDefaults is cluster-scoped (#457). Even when watching specific
# namespaces, the operator must be granted access via a ClusterRole -- a
# namespaced Role cannot grant access to a cluster-scoped resource, so without
# this the manager cache fails to sync and the operator shuts down (#529).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $managerName }}-cluster
  labels:
    {{- $labels | nindent 4 }}
rules:
  {{- include "openclaw-operator.clusterScopedRules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $managerBinding }}-cluster
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $managerName }}-cluster
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $saNamespace }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $managerName }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  {{- include "openclaw-operator.managerRules" . | nindent 2 }}
  {{- include "openclaw-operator.clusterScopedRules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $managerBinding }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $managerName }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $saNamespace }}
{{- end }}
{{- if .Values.leaderElection.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openclaw-operator.fullname" . }}-leader-election-role
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openclaw-operator.fullname" . }}-leader-election-rolebinding
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openclaw-operator.fullname" . }}-leader-election-role
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $saNamespace }}
{{- end }}
{{- end }}
