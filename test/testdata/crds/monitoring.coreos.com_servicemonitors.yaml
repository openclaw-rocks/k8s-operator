# Minimal ServiceMonitor CRD for envtest.
#
# The real definition ships with the Prometheus Operator and is far too large to
# vendor here. The operator only ever writes an unstructured object with a
# free-form spec, so preserving unknown fields is enough to exercise the
# ServiceMonitor lifecycle (create, update, delete-on-disable, owner-reference
# garbage collection) in integration tests (#589).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: servicemonitors.monitoring.coreos.com
spec:
  group: monitoring.coreos.com
  names:
    kind: ServiceMonitor
    listKind: ServiceMonitorList
    plural: servicemonitors
    singular: servicemonitor
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
